# Parked private-only template; cannot execute in this public repository.
# See tools/msi/lifecycle/README.md for authorization and source limits.
name: VX Bridge disposable lifecycle

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Reviewed exact lifecycle/product/test source (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: setup-lifecycle
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  REVISION: ${{ inputs.source_revision }}
  WORKFLOW_REVISION: ${{ github.workflow_sha }}
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: safe.directory
  GIT_CONFIG_VALUE_1: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  inputs:
    if: github.repository == 'devigned/vx-bridge' && github.event.repository.private && !github.event.repository.fork
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Require exact first-attempt manual source and provision build host
        run: |
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$REVISION" =~ ^[0-9a-f]{40}$ &&
            "$REVISION" == "$WORKFLOW_REVISION" && "$(uname -m)" == x86_64 ]] ||
            { echo 'Reviewed identical source/workflow and Linux amd64 required' >&2; exit 1; }
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates make jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build real A/B application bytes and one shared native core
        run: make install-setup-toolchain build-lifecycle-input
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: PRIVATE-LIFECYCLE-input-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-build-input/**
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          compression-level: 0

  lifecycle:
    needs: inputs
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NATIVE_ARTIFACT_ID: ${{ needs.inputs.outputs.artifact-id }}
      NATIVE_ARTIFACT_DIGEST: ${{ needs.inputs.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.inputs.outputs.artifact-id }}
          path: ${{ runner.temp }}/lifecycle-build-input
          digest-mismatch: error
      - name: Provide hosted GNU make
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm make'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Author exact A/B/fault media and qualify the fresh standard-account lifecycle
        env:
          BUILD_INPUT_DIR: ${{ runner.temp }}/lifecycle-build-input
          LIFECYCLE_EVIDENCE: ${{ runner.temp }}/lifecycle-evidence
        run: make author-lifecycle test-installer-lifecycle
      - name: Always verify exact original disposable-machine policy restoration
        if: ${{ always() }}
        env:
          LIFECYCLE_EVIDENCE: ${{ runner.temp }}/lifecycle-evidence
        run: make restore-lifecycle-policy
      - name: Retain actual first state before VM destruction, never purge product residue
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PRIVATE-LIFECYCLE-results-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lifecycle-evidence/**
            ${{ runner.temp }}/lifecycle-test-media/*/bridge.msi
            ${{ runner.temp }}/lifecycle-test-media/*/bridge.msi.sha256
            ${{ runner.temp }}/lifecycle-test-media/*/setup.exe
            ${{ runner.temp }}/lifecycle-test-media/*/setup.exe.sha256
            ${{ runner.temp }}/lifecycle-test-media/*/setup-input.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          compression-level: 0
