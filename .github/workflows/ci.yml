name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  RELEASE_VERSION: development
  SETUP_BUILD_PROFILE: normal
  REVISION: ${{ github.sha }}
  WORKFLOW_REVISION: ${{ github.workflow_sha }}
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: safe.directory
  GIT_CONFIG_VALUE_1: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Portable tests, vet, formatting, race and workflow lint
        run: make ci

  inputs:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Provision the pinned Linux build host
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates make jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build and verify exact application and native inputs once
        run: make install-setup-toolchain build-setup-input
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: vx-bridge-ci-input-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/setup-build-input/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  windows:
    needs: inputs
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      NATIVE_ARTIFACT_ID: ${{ needs.inputs.outputs.artifact-id }}
      NATIVE_ARTIFACT_DIGEST: ${{ needs.inputs.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.inputs.outputs.artifact-id }}
          path: ${{ runner.temp }}/setup-build-input
          digest-mismatch: error
      - name: Provide hosted GNU make
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm make'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Windows tests and static MSI/package integrity (no install or product launch)
        env:
          OUT: ${{ runner.temp }}/native-tool-tests
          BUILD_INPUT_DIR: ${{ runner.temp }}/setup-build-input
          EVIDENCE_DIR: ${{ runner.temp }}/setup-build-evidence
        run: make ci-windows build-setup-artifacts
      - name: Retain built application/installer bytes, authoring outcome and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vx-bridge-ci-authoring-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-artifacts/*
            ${{ runner.temp }}/setup-build-evidence/*
            ${{ runner.temp }}/native-tool-tests/*
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
          compression-level: 0
